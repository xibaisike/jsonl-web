// --- Prompt group helpers ---

// Group lines by user prompt: each user prompt is a top-level group,
// and all subsequent assistant/tool_result/tool-call/subagent entries
// that follow it (until the next user prompt) become its children.
function buildPromptGroups(lines) {
  var groups = [];
  var currentGroup = null;

  for (var i = 0; i < lines.length; i++) {
    var entry = lines[i];
    if (entry.type === 'user') {
      currentGroup = { user: entry, userIndex: i, children: [] };
      groups.push(currentGroup);
    } else if (currentGroup) {
      // Detect system-level tool calls and subagent events
      var isToolCall = entry.subtype === 'ui_telemetry' &&
        entry.systemPayload && entry.systemPayload.uiEvent &&
        entry.systemPayload.uiEvent['event.name'] === 'qwen-code.tool_call';
      var isSubagent = entry.subtype === 'ui_telemetry' &&
        entry.systemPayload && entry.systemPayload.uiEvent &&
        (entry.systemPayload.uiEvent['event.name'] || '').indexOf('subagent') !== -1;

      if (entry.type === 'assistant' || entry.type === 'tool_result' || isToolCall || isSubagent) {
        currentGroup.children.push({ entry: entry, index: i });
      }
    }
  }
  return groups;
}

// Truncated preview text for a tree node (~60 chars)
function getPreview(entry) {
  var type = entry.type;
  var preview = '';
  if (type === 'user') {
    preview = (entry.message && entry.message.parts && entry.message.parts[0] && entry.message.parts[0].text) || (entry.message && entry.message.content) || '';
  } else if (type === 'assistant') {
    var parts = (entry.message && entry.message.parts) || [];
    for (var j = 0; j < parts.length; j++) {
      if (parts[j].text) { preview = parts[j].text; break; }
      if (parts[j].thought) { preview = '[thinking]'; break; }
      if (parts[j].functionCall) { preview = parts[j].functionCall.name; break; }
    }
  } else if (type === 'tool_result') {
    var result = entry.toolCallResult || entry.tool_result || {};
    preview = result.name || entry.toolName || 'tool';
  } else if (type === 'system' && entry.subtype === 'ui_telemetry') {
    var uiEvent = entry.systemPayload && entry.systemPayload.uiEvent;
    if (uiEvent) {
      var eventName = uiEvent['event.name'] || '';
      if (eventName === 'qwen-code.tool_call') {
        preview = uiEvent.function_name || 'tool call';
      } else if (eventName.indexOf('subagent') !== -1) {
        preview = eventName;
      }
    }
  }
  if (typeof preview === 'string' && preview.length > 60) preview = preview.slice(0, 60) + '...';
  return preview || '';
}

// Icon for an outline entry
function getEntryIcon(entry) {
  var type = entry.type;
  if (type === 'user') return Icon.user;
  if (type === 'assistant') return Icon.bot;
  if (type === 'tool_result') return Icon.tool;
  if (type === 'system' && entry.subtype === 'ui_telemetry') {
    var uiEvent = entry.systemPayload && entry.systemPayload.uiEvent;
    if (uiEvent) {
      var eventName = uiEvent['event.name'] || '';
      if (eventName === 'qwen-code.tool_call') return Icon.tool;
      if (eventName.indexOf('subagent') !== -1) return Icon.system;
    }
  }
